# generated by okoko from theme {{NAME}}
set -g status-style "bg={{BG_ALT}},fg={{FG}}"
set -g status-left "#[bg={{ACCENT}},fg={{BG}},bold]  #S #[default] "
set -g status-right "#[fg={{MUTED}}]#(okoko-bar vpn --plain)  #(okoko-bar target --plain) #[bg={{SURFACE}},fg={{FG}}] %H:%M "
set -g window-status-format " #[fg={{MUTED}}]#I:#W "
set -g window-status-current-format "#[bg={{SURFACE}},fg={{FG}},bold] #I:#W "
set -g pane-border-style "fg={{SURFACE}}"
set -g pane-active-border-style "fg={{ACCENT}}"
set -g message-style "bg={{ACCENT}},fg={{BG}}"
set -g mode-style "bg={{ACCENT}},fg={{BG}}"
