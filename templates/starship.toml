# generated by okoko from theme {{NAME}}
# The [vpn] and [target] segments come from $OKOKO_VPN / $OKOKO_TARGET (set by the zsh precmd hook).
add_newline = true
format = """
[╭─](fg:surface)$username[@](fg:muted)$hostname ${env_var.OKOKO_VPN}${env_var.OKOKO_TARGET}$directory$git_branch$git_status$python$cmd_duration
[╰─](fg:surface)$character"""
palette = "okoko"

[palettes.okoko]
bg = "{{BG}}"
surface = "{{SURFACE}}"
accent = "{{ACCENT}}"
accent2 = "{{ACCENT2}}"
fg = "{{FG}}"
muted = "{{MUTED}}"
urgent = "{{URGENT}}"
warn = "{{WARN}}"

[username]
show_always = true
format = "[$user](bold fg:accent2)"
style_root = "bold fg:urgent"

[hostname]
ssh_only = false
format = "[$hostname](fg:accent) "

[env_var.OKOKO_VPN]
format = "[ 󰖂 $env_value ](bold fg:bg bg:accent) "

[env_var.OKOKO_TARGET]
format = "[ 󰓾 $env_value ](bold fg:bg bg:warn) "

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold fg:fg"
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[ $branch](fg:accent2) "

[git_status]
format = "[$all_status$ahead_behind](fg:warn) "

[python]
format = "[ $virtualenv](fg:muted) "
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 3000
format = "[ $duration](fg:muted)"

[character]
success_symbol = "[❯](bold fg:accent2)"
error_symbol = "[❯](bold fg:urgent)"
