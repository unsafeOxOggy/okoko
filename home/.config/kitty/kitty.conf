# okoko - kitty - colors come from the active theme (hot-reloaded on `okoko theme`)
include ~/.config/okoko/current/kitty-theme.conf

shell_integration enabled
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
disable_ligatures cursor

hide_window_decorations yes
window_padding_width    8
background_opacity      0.96
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    960
initial_window_height   600
enabled_layouts splits,stack
tab_bar_edge     top
tab_bar_style    powerline
tab_powerline_style slanted

# VMs without GPU: keep latency low without burning CPU
repaint_delay 10
input_delay   3
sync_to_monitor yes

enable_audio_bell no
visual_bell_duration 0.0
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
mouse_hide_wait 2.0
detect_urls yes
url_style curly
copy_on_select clipboard
strip_trailing_spaces smart
scrollback_lines 20000

# Allow `kitten @` and SIGUSR1 reloads
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard
map super+c           copy_to_clipboard
map super+v           paste_from_clipboard
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+enter  launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+u      kitten unicode_input
map ctrl+shift+f2     edit_config_file
map ctrl+shift+f5     load_config_file
