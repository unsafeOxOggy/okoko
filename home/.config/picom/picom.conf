# okoko - picom (v12+ syntax). The backend is chosen at launch by okoko-session:
# xrender inside VMs / software GL, glx on real GPUs.
vsync = false;
# off: with the xrender backend, damage tracking forgets static override-redirect
# windows (a polybar island with only fixed icons went blank after a workspace switch)
use-damage = false;

corner-radius = 8;
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.45;

fading = true;
# windows appear/disappear at once (fades kept for opacity changes only)
no-fading-openclose = true;
fade-delta = 5;
fade-in-step = 0.06;
fade-out-step = 0.06;

active-opacity = 1.0;
inactive-opacity = 0.94;
frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar'";
    corner-radius = 0; shadow = false; opacity = 1; unredir = false; },
  { match = "class_g = 'Rofi'"; shadow = true; opacity = 1; },
  { match = "class_g = 'flameshot' || class_g = 'Xfce4-screensaver'";
    shadow = false; fade = false; corner-radius = 0; opacity = 1; },
  { match = "fullscreen"; corner-radius = 0; },
  { match = "window_type = 'tooltip'"; opacity = 0.92; shadow = false; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
    shadow = false; },
  { match = "class_g = 'kitty' && !focused"; opacity = 0.92; },
  { match = "class_g = 'okoko-dropdown'"; opacity = 0.96; },
  { match = "class_g = 'firefox' || class_g = 'Burp' || class_g ~= 'burp'"; opacity = 1; },
);
