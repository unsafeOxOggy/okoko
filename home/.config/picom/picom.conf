# okoko - picom (v12+ syntax). The backend is chosen at launch by okoko-session:
# xrender inside VMs / software GL, glx on real GPUs.
vsync = false;
# off: with the xrender backend, damage tracking forgot static override-redirect
# windows (seen with the former polybar islands); full repaints are cheap enough
use-damage = false;

# square window corners, like kali-clean (xct)
corner-radius = 0;
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.45;

fading = true;
# windows appear/disappear at once (fades kept for opacity changes only)
no-fading-openclose = true;
fade-delta = 5;
fade-in-step = 0.06;
fade-out-step = 0.06;

frame-opacity = 1.0;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'i3bar'";
    shadow = false; opacity = 1; unredir = false; },
  { match = "class_g = 'Rofi'"; shadow = true; opacity = 1; },
  { match = "class_g = 'flameshot' || class_g = 'Xfce4-screensaver'";
    shadow = false; fade = false; opacity = 1; },
  { match = "window_type = 'tooltip'"; opacity = 0.92; shadow = false; },
  { match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu'";
    shadow = false; },
  { match = "(class_g = 'Xfce4-terminal' || class_g = 'kitty') && !focused"; opacity = 0.92; },
  { match = "role = 'okoko-dropdown'"; opacity = 0.96; },
  { match = "class_g = 'firefox' || class_g = 'Burp' || class_g ~= 'burp'"; opacity = 1; },
);
