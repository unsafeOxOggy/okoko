; okoko - polybar - colors come from the active theme
include-file = ~/.config/okoko/current/polybar-colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = false

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 6
offset-x = 0
offset-y = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 4pt
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 1
separator = "|"
separator-foreground = ${colors.background-alt}

font-0 = "JetBrainsMono Nerd Font:style=Regular:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=13;4"

modules-left = logo xworkspaces
modules-center = xwindow
modules-right = vpn target cpu memory filesystem date power

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

; -- left ------------------------------------------------
[module/logo]
type = custom/text
format = ""
format-font = 3
format-foreground = ${colors.primary}
click-left = kitty --class okoko-float -e sh -c "fastfetch; exec $SHELL"
click-right = okoko-menu keys

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
label-active = %name%
label-active-foreground = ${colors.secondary}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty =

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-empty = okoko
label-empty-foreground = ${colors.muted}

; -- right: hacking --------------------------------------
[module/vpn]
type = custom/script
exec = okoko-bar vpn
interval = 3
click-left = okoko-bar vpn --copy
format-prefix = "󰖂 "
format-prefix-foreground = ${colors.primary}

[module/target]
type = custom/script
exec = okoko-bar target
interval = 2
click-left = okoko-bar target --copy
click-right = okoko-menu target
format-prefix = "󰓾 "
format-prefix-foreground = ${colors.warn}

; -- right: system ---------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
format-warn-prefix = " "
format-warn-foreground = ${colors.alert}
label-warn = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
format-warn-foreground = ${colors.alert}
label-warn = %percentage_used:2%%

[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /
warn-percentage = 90
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %percentage_used%%
format-warn-foreground = ${colors.alert}
label-warn = %percentage_used%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %d %b  %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %date%

[module/power]
type = custom/text
format = ""
format-foreground = ${colors.alert}
click-left = okoko-menu power

; vim:ft=dosini
