; okoko - polybar "islands" - after waybar-themes V2.2 (HANCORE-linux), ported to i3/X11.
; Colors come from the active theme (~/.config/okoko/current/polybar-colors.ini).
;
; Polybar cannot frame a group of modules, so each island is its own small bar with a
; 2px rounded border, floating over a transparent strip (override-redirect). The space
; is reserved by i3 (gaps top in config.d/00-base.conf). okoko-bar launches them all.
;
;  [ icons ][ 1 2 3 4 5 ]          [ window title ]          [ vpn  target  cpu  mem  date ]
include-file = ~/.config/okoko/current/polybar-colors.ini

[settings]
; off: polybar's in-place reload leaves override-redirect islands blank after a resize;
; `okoko-bar watch` (started by okoko-session) relaunches them instead.
screenchange-reload = false
pseudo-transparency = false

[island]
monitor = ${env:MONITOR:}
height = 24
offset-y = 5
radius = 4
border-size = 2
border-color = ${colors.border}
background = ${colors.background}
foreground = ${colors.foreground}
padding = 1
module-margin = 1
fixed-center = true
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
override-redirect = true
wm-restack = i3
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

; -- islands ---------------------------------------------
[bar/icons]
inherit = island
width = 84
offset-x = 6
modules-center = logo themes power

[bar/workspaces]
inherit = island
width = 172
offset-x = 94
padding = 0
modules-center = workspaces

[bar/title]
inherit = island
width = 22%
offset-x = 39%
modules-center = xwindow

[bar/status]
inherit = island
width = 470
offset-x = 100%:-476
module-margin = 2
modules-center = vpn target cpu memory date

; -- icons -----------------------------------------------
[module/logo]
type = custom/text
format = ""
format-font = 2
click-left = kitty --class okoko-float -e sh -c "fastfetch; exec $SHELL"
click-right = okoko-menu keys

[module/themes]
type = custom/text
format = "󰏘"
format-font = 2
click-left = okoko-menu theme

[module/power]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.alert}
click-left = okoko-menu power

; -- workspaces: 1-5 always shown, like V2.2 "persistent-workspaces" ----------
[module/workspaces]
type = custom/script
exec = okoko-bar workspaces
tail = true

; -- title -----------------------------------------------
[module/xwindow]
type = internal/xwindow
label = %title:0:55:...%
label-empty = okoko
label-empty-foreground = ${colors.muted}

; -- status: "value icon", monochrome like V2.2 ----------
[module/vpn]
type = custom/script
exec = okoko-bar vpn
interval = 3
click-left = okoko-bar vpn --copy
format-suffix = " 󰖂"
format-suffix-font = 2

[module/target]
type = custom/script
exec = okoko-bar target
interval = 2
click-left = okoko-bar target --copy
click-right = okoko-menu target
format-suffix = " 󰓾"
format-suffix-font = 2
format-suffix-foreground = ${colors.warn}

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
label = %percentage%%
format-suffix = " 󰍛"
format-suffix-font = 2
label-warn = %percentage%%
format-warn-suffix = " 󰍛"
format-warn-suffix-font = 2
format-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90
label = %percentage_used%%
format-suffix = " "
format-suffix-font = 2
label-warn = %percentage_used%%
format-warn-suffix = " "
format-warn-suffix-font = 2
format-warn-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date = %H:%M %a
date-alt = %d/%m/%Y  %H:%M:%S
format-prefix = "󰃭 "
format-prefix-font = 2
label = %date%

; vim:ft=dosini
