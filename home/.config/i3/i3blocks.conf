# okoko - i3blocks: the blocks of kali-clean (xct) plus the engagement target.
# Kali's i3blocks 1.5 no longer ships the /usr/share/i3blocks scripts, so each
# block is a small inline command. Clicks arrive in $button (1 left, 3 right).
separator_block_width=30
separator=false
markup=none

# workspaces: 1-4 always shown, 5-10 only when they exist; left click switches.
# Colors of kali-clean (xct). signal=2: refreshed by the [wswatch] block below.
[ws1]
command=okoko-bar ws 1
format=json
interval=once
signal=2
[ws2]
command=okoko-bar ws 2
format=json
interval=once
signal=2
[ws3]
command=okoko-bar ws 3
format=json
interval=once
signal=2
[ws4]
command=okoko-bar ws 4
format=json
interval=once
signal=2
[ws5]
command=okoko-bar ws 5
format=json
interval=once
signal=2
[ws6]
command=okoko-bar ws 6
format=json
interval=once
signal=2
[ws7]
command=okoko-bar ws 7
format=json
interval=once
signal=2
[ws8]
command=okoko-bar ws 8
format=json
interval=once
signal=2
[ws9]
command=okoko-bar ws 9
format=json
interval=once
signal=2
[ws10]
command=okoko-bar ws 10
format=json
interval=once
signal=2

# one i3 subscription keeps the workspace blocks in sync; its " " is the gap after them
[wswatch]
command=printf ' \n'; i3-msg -t subscribe -m '["workspace"]' | while read -r _; do pkill -RTMIN+2 -x i3blocks; done
interval=persist

# engagement target (okoko-menu target / tgt): left click copies, right click edits.
# signal=1: okoko-menu and tgt refresh it at once with pkill -RTMIN+1 i3blocks
[target]
label=󰓾 
command=case $button in 1) okoko-bar target --copy >/dev/null ;; 3) setsid -f okoko-menu target >/dev/null 2>&1 ;; esac; okoko-bar target --plain
color=#E5C07B
interval=5
signal=1

[cpu]
label= CPU 
command={ head -1 /proc/stat; sleep 1; head -1 /proc/stat; } | awk '{u = $2 + $3 + $4 + $7 + $8; t = u + $5 + $6} NR == 1 {pu = u; pt = t; next} {printf "%.0f%%\n", (u - pu) * 100 / (t - pt)}'
interval=5

[memory]
label= RAM 
command=free -b | awk '/^Mem/ {printf "%.1fG/%.1fG\n", $3 / 2^30, $2 / 2^30}'
interval=10

[disk]
label= Disk 
command=df -h --output=avail "$HOME" | tail -1 | tr -d ' '
interval=240

# traffic of the interface with the default route
[bandwidth]
label= 
command=i=$(ip route show default | awk '{print $5; exit}'); [ -n "$i" ] || exit 0; s=/sys/class/net/$i/statistics; r=$(cat $s/rx_bytes); t=$(cat $s/tx_bytes); sleep 1; echo "$(( ($(cat $s/rx_bytes) - r) / 1024 ))K/s $(( ($(cat $s/tx_bytes) - t) / 1024 ))K/s"
interval=5

# VPN address (tun0/wg0...), hidden when down; left click copies it
[vpn]
label= 
command=[ "$button" = 1 ] && okoko-bar vpn --copy >/dev/null; okoko-bar vpn --plain
color=#3BB92D
interval=5

[time]
label= 
command=date '+%A, %d %B %Y %H:%M:%S '
interval=1
