# Bar: i3bar + i3blocks, the bar of kali-clean by xct (colors included).
# -t: transparent background (picom composites it). i3bar follows screen size
# changes by itself. Blocks: ~/.config/i3/i3blocks.conf
bar {
    status_command i3blocks -c ~/.config/i3/i3blocks.conf
    i3bar_command i3bar -t
    position top
    height 26
    font pango:JetBrainsMono Nerd Font 8
    colors {
        background #1C1D2B88
        statusline #E6FFF5
        focused_workspace #282A3E88 #282A3E88 #FFFFFF
    }
}
