# Window rules
for_window [class="okoko-float"] floating enable, resize set 960 600, move position center
for_window [class="okoko-dropdown"] floating enable, resize set 100 ppt 45 ppt, move position 0 px 0 px, move scratchpad, sticky enable
for_window [window_role="(?i)pop-up|dialog|bubble|task_dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="utility"] floating enable
for_window [window_type="toolbar"] floating enable
for_window [window_type="splash"] floating enable
for_window [class="(?i)arandr|lxappearance|pavucontrol|blueman|nm-connection-editor|qt5ct|qt6ct"] floating enable
for_window [class="(?i)flameshot"] floating enable, border none
for_window [title="(?i)burp suite.*loading|^Burp Suite Community Edition$"] floating enable
for_window [class="^.*"] border pixel 2
