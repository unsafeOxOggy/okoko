# Base settings
set $mod Mod4
# xfce4-terminal, not kitty: without a GPU (VM with 3D off) kitty renders through llvmpipe,
# ~74 ms from key press to screen; xfce4-terminal ~25 ms (measured on the VM, 2026-10-21).
# One server process for all windows: after the first, a window opens in ~0.14 s.
set $term xfce4-terminal
set $menu okoko-menu
# workspaces are plain numbers (no icons on the bar)
set $ws1  "1"
set $ws2  "2"
set $ws3  "3"
set $ws4  "4"
set $ws5  "5"
set $ws6  "6"
set $ws7  "7"
set $ws8  "8"
set $ws9  "9"
set $ws10 "10"

font pango:JetBrainsMono Nerd Font 9
floating_modifier $mod
tiling_drag modifier titlebar
focus_follows_mouse no
focus_on_window_activation smart
workspace_auto_back_and_forth yes

default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
gaps inner 6
gaps outer 2
