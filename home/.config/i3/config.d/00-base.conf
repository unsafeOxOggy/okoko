# Base settings
set $mod Mod4
# One kitty process for all terminals: a new window opens instantly instead of paying
# kitty's ~2s start-up (Python + OpenGL via virgl) in the VM. okoko-session pre-starts it.
set $term kitty -1 --instance-group okoko
set $menu okoko-menu
set $ws1  "1:"
set $ws2  "2:"
set $ws3  "3:"
set $ws4  "4:"
set $ws5  "5:"
set $ws6  "6"
set $ws7  "7"
set $ws8  "8"
set $ws9  "9"
set $ws10 "10"

font pango:JetBrainsMono Nerd Font 9
floating_modifier $mod
tiling_drag modifier titlebar
focus_follows_mouse no
focus_on_window_activation smart
workspace_auto_back_and_forth yes

default_border pixel 2
default_floating_border pixel 2
hide_edge_borders smart
gaps inner 6
gaps outer 2
