# Keybindings. A line "## Category: description" documents the binding below it
# and is shown by the cheat sheet ($mod+F1).

## Apps: terminal
bindsym $mod+Return exec --no-startup-id $term
## Apps: floating terminal
bindsym $mod+Shift+Return exec --no-startup-id $term --class okoko-float
## Apps: dropdown terminal (scratchpad)
bindsym $mod+grave exec --no-startup-id okoko-dropdown
## Apps: application launcher
bindsym $mod+space exec --no-startup-id rofi -show drun
## Apps: switch window
bindsym $mod+Tab exec --no-startup-id rofi -show window
## Apps: file manager
bindsym $mod+Shift+f exec thunar
## Apps: browser
bindsym $mod+Shift+b exec firefox
## Apps: editor (Sublime Text)
bindsym $mod+Shift+n exec subl
## Apps: system monitor
bindsym $mod+Shift+m exec --no-startup-id $term --class okoko-float -e btop

## Workflow: set / clear target IP
bindsym $mod+t exec --no-startup-id $menu target
## Workflow: copy VPN (tun0) IP
bindsym $mod+i exec --no-startup-id okoko-bar vpn --copy

## Look: change theme
bindsym $mod+Shift+t exec --no-startup-id $menu theme
## Look: next wallpaper
bindsym $mod+q exec --no-startup-id okoko-wall next
## Look: geometric wallpaper from theme
bindsym $mod+Shift+q exec --no-startup-id okoko-wall gen

## Clipboard: copy (Ctrl+Shift+C in terminals)
bindsym --release $mod+c exec --no-startup-id okoko-clip copy
## Clipboard: cut
bindsym --release $mod+x exec --no-startup-id okoko-clip cut
## Clipboard: paste (Ctrl+Shift+V in terminals)
bindsym --release $mod+v exec --no-startup-id okoko-clip paste
## Clipboard: history, text + images
bindsym $mod+Ctrl+v exec --no-startup-id okoko-clip history

## System: shortcut cheat sheet
bindsym $mod+F1 exec --no-startup-id $menu keys
## System: power menu
bindsym $mod+Shift+Escape exec --no-startup-id $menu power
## System: lock screen
bindsym $mod+Escape exec --no-startup-id xflock4
## System: screenshot (area)
bindsym Print exec --no-startup-id flameshot gui
## System: screenshot (full screen, saved)
bindsym Shift+Print exec --no-startup-id flameshot full -p ~/Pictures/Screenshots
## System: dismiss notifications
bindsym $mod+n exec --no-startup-id dunstctl close-all
## System: reload i3 config
bindsym $mod+Shift+c reload
## System: restart i3 + bar
bindsym $mod+Shift+r restart
## System: exit i3
bindsym $mod+Shift+e exec --no-startup-id $menu power

## Windows: close
bindsym $mod+w kill
## Windows: focus left/down/up/right
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
## Windows: move left/down/up/right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
## Windows: fullscreen
bindsym $mod+f fullscreen toggle
## Windows: toggle floating
bindsym $mod+Shift+space floating toggle
## Windows: tabbed layout
bindsym $mod+s layout tabbed
## Windows: toggle split layout
bindsym $mod+e layout toggle split
## Windows: split horizontal
bindsym $mod+b split h
## Windows: split vertical
bindsym $mod+Shift+v split v
## Windows: focus parent
bindsym $mod+a focus parent
## Windows: send to scratchpad
bindsym $mod+Shift+minus move scratchpad
## Windows: show scratchpad
bindsym $mod+minus scratchpad show
## Windows: resize mode (hjkl, Esc to leave)
bindsym $mod+r mode "resize"
