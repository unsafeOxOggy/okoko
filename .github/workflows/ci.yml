name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shopt -s globstar
          shellcheck -S warning -x okoko install.sh lib/*.sh bin/* || true
          shellcheck -S error -x okoko install.sh lib/*.sh bin/*
      - name: bats smoke tests
        run: |
          sudo apt-get install -y bats
          bats tests/
